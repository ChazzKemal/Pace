# PACE at 2x. Eval-time speed modulation: applies to any checkpoint, including a
# plain baseline, because nothing about it is baked into the weights.
_include: deploy_defaults.yaml

method:
  type: pace
  max_speed: 1.5            # also sizes the gain scaler when gains.scale_kp is on
  min_speed: 1.5
  clamp_deg: 5.0
  n_lookahead: 2
  action_stride: 2          # execute every 2nd predicted action...
  gripper_stride_exempt: true
                            # ...except where the gripper is moving, which is never
                            # dropped. The alternative -- dropping those steps and
                            # repaying them downstream -- gives the arm a hold or an
                            # interpolated guess in place of poses the policy actually
                            # predicted, and has to get the repayment arithmetic right
                            # on a run 2-4 rows long. adaptive_stride does NOT cover
                            # this: it restores steps where the path bends, and a
                            # grasp on a straight approach has no bend. 
  gripper_stride_eps: 0.10
