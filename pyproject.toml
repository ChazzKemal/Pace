[project]
name = "robot-stack"
version = "0.1.0"
description = "Speedup methods for LeRobot policies: PACE, DemoSpeedup, B-spline. Sim (LIBERO/xVLA) and real (UR10e/ACT,Diffusion)."
requires-python = ">=3.12"

dependencies = [
  # Stock upstream LeRobot, pinned by SHA. Never forked, never edited in place.
  # Everything this package adds attaches through LeRobot's public registries:
  #   PreTrainedConfig / OptimizerConfig / ProcessorStepRegistry.
  #
  # Extras (they compose — `training` and `libero` both pull in `dataset`):
  #   xvla        the sim policy
  #   libero      the sim env
  #   training    lerobot-train + LeRobotDataset I/O
  #   evaluation  lerobot-eval
  #
  # Bumping this pin is a deliberate, reviewed change: it is the one place the
  # whole stack's LeRobot version is decided, for sim and robot alike.
  "lerobot[xvla,libero,training,evaluation,peft] @ git+https://github.com/huggingface/lerobot@bf31dd794ffb4f87380aba3912f64421e8352d3c",

  # Patched robosuite, pinned by SHA for the same reason as LeRobot above.
  #
  # PACE's *actuation* half needs simulator hooks that stock robosuite 1.4.0 does
  # not expose: `set_action_exhaust_speed` (run fewer, larger control substeps) and
  # `update_kp_scale` / `update_kd_scale` (bump OSC gains to track the faster action
  # stream). The fork adds those plus the raised Panda velocity limits and OSC config
  # they require -- 309 lines over 11 files, including robot.xml and JSON assets, so
  # it cannot be reduced to a runtime monkeypatch.
  #
  # This is the simulator, not one of our methods: we depend on it, we do not vendor
  # it. Overrides the stock robosuite that hf-libero would otherwise pull in.
  #
  # SSH rather than HTTPS because the repo is private: installing needs a GitHub key
  # in the agent. Worth revisiting if the fork is ever made public or upstreamed.
  "robosuite @ git+ssh://git@github.com/ChazzKemal/robosuite@71ee4f30c3032fbb0afa716f20be656ee48bfa16",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required because the LeRobot dependency above is a direct git+URL reference
# (we pin by SHA rather than by version range).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/robot_stack"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
