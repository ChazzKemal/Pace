[project]
name = "robot-stack"
version = "0.1.0"
description = "Speedup methods for LeRobot policies: PACE, DemoSpeedup, B-spline. Sim (LIBERO/xVLA) and real (UR10e/ACT,Diffusion)."
requires-python = ">=3.12"

dependencies = [
  # Stock upstream LeRobot, pinned by SHA. Never forked, never edited in place.
  # Everything this package adds attaches through LeRobot's public registries:
  #   PreTrainedConfig / OptimizerConfig / ProcessorStepRegistry.
  #
  # Extras (they compose — `training` and `libero` both pull in `dataset`):
  #   xvla        the sim policy
  #   libero      the sim env
  #   training    lerobot-train + LeRobotDataset I/O
  #   evaluation  lerobot-eval
  #
  # Bumping this pin is a deliberate, reviewed change: it is the one place the
  # whole stack's LeRobot version is decided, for sim and robot alike.
  "lerobot[xvla,libero,training,evaluation] @ git+https://github.com/huggingface/lerobot@bf31dd794ffb4f87380aba3912f64421e8352d3c",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required because the LeRobot dependency above is a direct git+URL reference
# (we pin by SHA rather than by version range).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/robot_stack"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
